
# Phase Α v2: Best Combo + Combined Loss FT+Lovász (50/50).
# Train-from-scratch με 0.5*FocalTversky(α=0.4,β=0.6) + 0.5*LovászSoftmax.
# Standard literature ratio. Δεύτερη iteration μετά το 70/30 (test mIoU=0.8386).
#
# Reference (Best Combo, FT only): F1=0.9104, mIoU=0.8408
# Goal: μέτρηση αν Lovász component βελτιώνει direct IoU optimization.


experiment:
  name: weedmapping-weedsgalore
  group: BestCombo-Lovasz-50-50
  continue_with_errors: false  # full traceback αν crash
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[best_combo_lovasz, ft_lov_50_50, focal_tversky_lovasz, splitlawin_b0]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedsGaloreDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal_tversky_lovasz]
      params:
        # Focal Tversky parameters (best α/β από ablation)
        alpha: [0.4]
        beta: [0.6]
        gamma: [1.3333]
        # Combined weights — 50/50 standard balance
        ft_weight: [0.5]
        lov_weight: [0.5]
        lovasz_classes: ['present']
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]
    mixed_precision: [True]

  early_stopping:
    patience: [30]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
    iou: *metric_params
  test_metrics:
    iou: *metric_params
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  # ΙΔΙΟ architecture με Best_CIR_B_RE_AB_04_06.yaml (winner)
  model:
    name: [wd/models/splitlawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      main_channels: [3]
      main_pretrained: [['G', 'G', 'R']]      # CIR composite mapping
      side_pretrained: [['B', 'G']]           # B uses Blue, RE uses G
      fusion_type: ['squeeze_excite']

  dataset:
    root: ["/workspace/datasets/weedsgalore/weedsgalore-dataset"]
    tile: [False]
    hor_flip: [True]
    ver_flip: [True]
    channels: [['CIR', 'B', 'RE']]
    batch_size: [4]
    val_batch_size: [2]
    test_batch_size: [2]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]

other_grids: []

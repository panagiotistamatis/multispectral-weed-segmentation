
# Multi-seed verification του Boundary DoU peak (bdou_weight=0.3).
# Seeds 43, 44 — έχουμε ήδη seed=42 → mIoU=0.8451 (driven-sunset-104).
# Στόχος: επιβεβαίωση ότι το peak είναι σταθερό, όχι lucky single seed.
#
# Comparison target: Adam baseline (3-seed) mIoU = 0.839 ± 0.006
# Για να είναι BDoU σαφώς καλύτερο: 3-seed mean > 0.845 (+1σ).


experiment:
  name: weedmapping-weedsgalore
  group: LossOpt-BoundaryDoU-MultiSeed
  continue_with_errors: true
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[loss_opt, boundary_dou, multi_seed, bdou_03, bestcombo, splitlawin_b0]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedsGaloreDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal_tversky_lovasz_boundary]
      params:
        alpha: [0.4]
        beta: [0.6]
        gamma: [1.3333]
        ft_weight: [0.4]
        lov_weight: [0.4]
        bdou_weight: [0.3]
        lovasz_classes: ['present']
        num_classes: [3]
    # Grid sweep over seeds — δημιουργεί 2 runs (43, 44)
    seed: [43, 44]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]
    mixed_precision: [True]

  early_stopping:
    patience: [30]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
    iou: *metric_params
  test_metrics:
    iou: *metric_params
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  model:
    name: [wd/models/splitlawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      main_channels: [3]
      main_pretrained: [['G', 'G', 'R']]
      side_pretrained: [['B', 'G']]
      fusion_type: ['squeeze_excite']

  dataset:
    root: ["/workspace/datasets/weedsgalore/weedsgalore-dataset"]
    tile: [False]
    hor_flip: [True]
    ver_flip: [True]
    channels: [['CIR', 'B', 'RE']]
    batch_size: [4]
    val_batch_size: [2]
    test_batch_size: [2]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]

other_grids: []


# Sprint 7: Winner config (ASVF + SCSA F4) with MiT-B1 backbone instead of B0.
# Reference (B0 winner): mIoU=0.8469, F1~=0.913, 5.4M params
# Hypothesis: B1 (~14M backbone vs 3.7M in B0) offers richer representations.
# Earlier B1 attempts crashed at batch=4 with GPU loss. Batch=2 is safer.
#
# Memory concern: B1 backbone is deeper -> SCSA at F4 will have 512 channels (vs 256 in B0).
# Embed dim in the LawinHead = 512 for B1 (vs 256 in B0).


experiment:
  name: weedmapping-weedsgalore
  group: Best-B1-WeedsGalore
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[asvf, scsa_f4, mit_b1, focal_tversky_lovasz, cir_b_re, splitlawin_b1]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedsGaloreDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal_tversky_lovasz]
      params:
        alpha: [0.4]
        beta: [0.6]
        gamma: [1.3333]
        ft_weight: [0.5]
        lov_weight: [0.5]
        lovasz_classes: ['present']
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]
    mixed_precision: [True]

  early_stopping:
    patience: [30]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
    iou: *metric_params
  test_metrics:
    iou: *metric_params
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  model:
    name: [wd/models/splitlawin]
    params:
      backbone: [MiT-B1]            # <-- Upgrade B0 -> B1
      backbone_pretrained: [True]
      main_channels: [3]
      main_pretrained: [['G', 'G', 'R']]
      side_pretrained: [['B', 'G']]
      fusion_type: ['squeeze_excite']
      # ASVF + SCSA F4 (winner architecture)
      use_asvf: [True]
      asvf_nir_idx: [0]
      asvf_red_idx: [2]
      use_scsa: [True]

  dataset:
    root: ["/workspace/datasets/weedsgalore/weedsgalore-dataset"]
    tile: [False]
    hor_flip: [True]
    ver_flip: [True]
    channels: [['CIR', 'B', 'RE']]
    # B1 is heavier -> batch=2 for safe memory (B1 at batch=4 had GPU lost crashes)
    batch_size: [2]
    val_batch_size: [1]
    test_batch_size: [1]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]

other_grids: []

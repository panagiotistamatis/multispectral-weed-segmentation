
# Stage 3b: Focal Tversky Loss (Abraham & Khan, 2018).
# SplitLawin MiT-B0 | R,G,B,NIR,RE | main=RGB + side=NIR,RE | SE | NoTile 608
# FTL = (1 - mean_c(TI_c))^(1/gamma)
# TI_c = TP / (TP + alpha*FP + beta*FN)   per-class soft counts
# Paper's best: alpha=0.3 (FP), beta=0.7 (FN - recall-oriented), gamma=4/3.
# No class weights - per-class averaging already handles imbalance.


experiment:
  name: weedmapping-weedsgalore
  group: LossVariants-WeedsGalore
  continue_with_errors: true
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[loss_variant, focal_tversky, no_tile, weedsgalore, splitlawin_b0]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedsGaloreDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal_tversky]
      params:
        alpha: [0.3]
        beta: [0.7]
        gamma: [1.3333]
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]
    # mixed_precision: True για VRAM savings (~30%) σε 1080 Ti.
    # Pascal δεν έχει Tensor Cores οπότε δεν περιμένουμε speedup, αλλά το FP16
    # κατεβάζει peak VRAM από 10.9GB σε ~7.5GB — απαραίτητο για ασφαλές 5ωρο run.
    mixed_precision: [True]

  early_stopping:
    patience: [30]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
    iou: *metric_params       # per-class iou_0/1/2 + macro iou (=mIoU)
  test_metrics:
    iou: *metric_params       # per-class iou_0/1/2 + macro iou (=mIoU)
    jaccard: *metric_params   # raw torchmetrics, ίδιο macro mIoU (κρατημένο για backward compat)
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  model:
    name: [wd/models/splitlawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      main_channels: [3]
      main_pretrained: [['R', 'G', 'B']]
      side_pretrained: ['G']
      fusion_type: ['squeeze_excite']

  dataset:
    root: ["/workspace/datasets/weedsgalore/weedsgalore-dataset"]
    tile: [False]
    hor_flip: [True]
    ver_flip: [True]
    channels: [['R', 'G', 'B', 'NIR', 'RE']]
    # 1080 Ti 11GB → ξεκινάμε batch_size=4. Αν χωράει στο smoke-orion, σκαλώνουμε σε 6.
    batch_size: [4]
    val_batch_size: [2]
    test_batch_size: [2]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]
    SegmentationVisualizationCallback:

other_grids: []

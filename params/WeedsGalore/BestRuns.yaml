
# WeedsGalore BestRuns — LWViTs (Eschikon-style table, adapted for WeedsGalore)
# 6 total runs, one grid per model variant
#
# Grid 0: Lawin        MiT-B0 | R,G,NIR,RE  | pretrained R,G     | Fine-tuning | --
# Grid 1: Lawin        MiT-B1 | NDVI        | pretrained R       | Freeze      | --
# Grid 2: DoubleLawin  MiT-B0 | R,G,NDVI    | pretrained R,G,G   | Freeze      | Conv
# Grid 3: DoubleLawin  MiT-B1 | R,G,NDVI    | pretrained R,G,G   | Freeze      | Drop
# Grid 4: SplitLawin   MiT-B0 | R,G,NDVI    | pretrained R,G,G   | Fine-tuning | Drop
# Grid 5: SplitLawin   MiT-B1 | R,G,NDVI    | pretrained R,G,G   | Fine-tuning | Drop


experiment:
  name: weedmapping-weedsgalore
  group: BestRuns-WeedsGalore-Eschikon
  continue_with_errors: true
  start_from_grid: 1  # Skip Grid 0 (Lawin B0, crashed - re-run later) and 4,5 (SplitLawin, already done). Run freeze grids 1,2,3.
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[best_run, weedsgalore, eschikon_table]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedsGaloreDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal]
      params:
        weight: [[0.0262, 1.0, 0.5818]]
        gamma: [2.0]
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]  # Grid 0 (Lawin B0) = Fine-tuning. Overridden per grid below.

  early_stopping:
    patience: [30]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
  test_metrics:
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  # --- Grid 0: Lawin MiT-B0 | R,G,NIR,RE | pretrained R,G | Fine-tuning ---
  model:
    name: [wd/models/lawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      main_channels: [4]
      main_pretrained: [['R', 'G', 'R', 'G']]
      side_pretrained: [null]

  dataset:
    root: ["<REDACTED_LOCAL_PATH>"]
    hor_flip: [True]
    ver_flip: [True]
    channels: [['R', 'G', 'NIR', 'RE']]
    batch_size: [6]
    val_batch_size: [12]
    test_batch_size: [12]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]
    SegmentationVisualizationCallback:
  # val_callbacks disabled to avoid wandb media temp file race condition (killed Lawin B0 at epoch 72)
  # val_callbacks:
  #   SegmentationVisualizationCallback:
  #     batch_idxs: [[4, 16]]

other_grids:
  # --- Grid 1: Lawin MiT-B1 | NDVI | pretrained R | Freeze ---
  - model:
      name: [wd/models/lawin]
      params:
        backbone: [MiT-B1]
        backbone_pretrained: [True]
        main_channels: [1]
        main_pretrained: [['R']]
        side_pretrained: [null]
    dataset:
      channels: [['NDVI']]
    train_params:
      freeze_pretrained: [True]

  # --- Grid 2: DoubleLawin MiT-B0 | R,G,NDVI | pretrained R,G,G | Freeze | Conv ---
  - model:
      name: [wd/models/doublelawin]
      params:
        backbone: [MiT-B0]
        backbone_pretrained: [True]
        main_channels: [2]
        main_pretrained: [['R', 'G']]
        side_pretrained: ['G']
        fusion_type: ['conv_sum']
    dataset:
      channels: [['R', 'G', 'NDVI']]
    train_params:
      freeze_pretrained: [True]

  # --- Grid 3: DoubleLawin MiT-B1 | R,G,NDVI | pretrained R,G,G | Freeze | Drop ---
  - model:
      name: [wd/models/doublelawin]
      params:
        backbone: [MiT-B1]
        backbone_pretrained: [True]
        main_channels: [2]
        main_pretrained: [['R', 'G']]
        side_pretrained: ['G']
        fusion_type: ['conv_sum_drop']
    dataset:
      channels: [['R', 'G', 'NDVI']]
    train_params:
      freeze_pretrained: [True]

  # --- Grid 4: SplitLawin MiT-B0 | R,G,NDVI | pretrained R,G,G | Fine-tuning | Drop ---
  - model:
      name: [wd/models/splitlawin]
      params:
        backbone: [MiT-B0]
        backbone_pretrained: [True]
        main_channels: [2]
        main_pretrained: [['R', 'G']]
        side_pretrained: ['G']
        fusion_type: ['conv_sum_drop']
    dataset:
      channels: [['R', 'G', 'NDVI']]
    train_params:
      freeze_pretrained: [False]

  # --- Grid 5: SplitLawin MiT-B1 | R,G,NDVI | pretrained R,G,G | Fine-tuning | Drop ---
  - model:
      name: [wd/models/splitlawin]
      params:
        backbone: [MiT-B1]
        backbone_pretrained: [True]
        main_channels: [2]
        main_pretrained: [['R', 'G']]
        side_pretrained: ['G']
        fusion_type: ['conv_sum_drop']
    dataset:
      channels: [['R', 'G', 'NDVI']]
    train_params:
      freeze_pretrained: [False]

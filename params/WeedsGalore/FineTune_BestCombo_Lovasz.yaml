
# Phase B: Fine-tune του Best Combo με Focal Tversky + Lovasz combined loss.
# Φορτώνει το ckpt_best του winner run (CIR+B+RE, α=0.4/β=0.6, mIoU=0.8408)
# και συνεχίζει με 0.5·FT + 0.5·Lovasz, lower LR, για 100 epochs.
#
# !! ΠΡΕΠΕΙ να συμπληρωθεί το resume_path με την πραγματική διαδρομή του ckpt !!
# Στον orion: find ~/LWViTs-for-weedmapping/experiments -name "ckpt_best.pth" \
#                  -path "*BestCombination*"


experiment:
  name: weedmapping-weedsgalore
  group: FineTuneBestCombo-Lovasz
  continue_with_errors: false  # full traceback αν crash
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[finetune, lovasz, best_combo, cir_b_re, splitlawin_b0]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedsGaloreDatasetInterface]

  train_params:
    # Fine-tuning: λίγα epochs με χαμηλό lr
    max_epochs: [100]
    initial_lr: [0.00001]   # 1e-5 (10x κάτω από original 1e-4)
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal_tversky_lovasz]
      params:
        alpha: [0.4]
        beta: [0.6]
        gamma: [1.3333]
        ft_weight: [0.5]
        lov_weight: [0.5]
        lovasz_classes: ['present']
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]
    mixed_precision: [True]
    # Resume από το Best Combo ckpt — !! ΣΥΜΠΛΗΡΩΣΕ το πραγματικό path !!
    resume: [True]
    ckpt_name: [ckpt_best.pth]
    resume_path: ["/workspace/experiments/weedmapping-weedsgalore/BestCombination-WeedsGalore/wandb/REPLACE_WITH_RUN_FOLDER/files/ckpt_best.pth"]

  early_stopping:
    patience: [15]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
    iou: *metric_params
  test_metrics:
    iou: *metric_params
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  # ΙΔΙΟ architecture με Best_CIR_B_RE_AB_04_06.yaml
  model:
    name: [wd/models/splitlawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      main_channels: [3]
      main_pretrained: [['G', 'G', 'R']]
      side_pretrained: [['B', 'G']]
      fusion_type: ['squeeze_excite']

  dataset:
    root: ["/workspace/datasets/weedsgalore/weedsgalore-dataset"]
    tile: [False]
    hor_flip: [True]
    ver_flip: [True]
    channels: [['CIR', 'B', 'RE']]
    batch_size: [4]
    val_batch_size: [2]
    test_batch_size: [2]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]

other_grids: []

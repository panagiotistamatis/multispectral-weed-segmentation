
# Lawin MiT-B0 + MiT-B1 | CIR | pretrained G,G,R | Fine-tuning
# Re-run with early_stopping patience=30 (previously 10).


experiment:
  name: weedmapping-weedsgalore
  group: BestRuns-WeedsGalore-Eschikon
  continue_with_errors: true
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[best_run, weedsgalore, eschikon_table, cir, patience30]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedsGaloreDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal]
      params:
        weight: [[0.0262, 1.0, 0.5818]]
        gamma: [2.0]
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]

  early_stopping:
    patience: [30]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
  test_metrics:
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  # Lawin MiT-B0 + MiT-B1 | CIR | pretrained G,G,R | Fine-tuning
  model:
    name: [wd/models/lawin]
    params:
      backbone: [MiT-B0, MiT-B1]
      backbone_pretrained: [True]
      main_channels: [3]
      main_pretrained: [['G', 'G', 'R']]
      side_pretrained: [null]

  dataset:
    root: ["<REDACTED_LOCAL_PATH>"]
    hor_flip: [True]
    ver_flip: [True]
    channels: ['CIR']
    batch_size: [6]
    val_batch_size: [12]
    test_batch_size: [12]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]
    SegmentationVisualizationCallback:
  # val_callbacks disabled to avoid wandb media temp file race condition

other_grids: []

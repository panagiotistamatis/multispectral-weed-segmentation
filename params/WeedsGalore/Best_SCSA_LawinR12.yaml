
# Sprint 5: Winner config (ASVF + SCSA F4) + Lawin ratios [12, 4, 2].
# Reference winner: mIoU=0.8469, F1≈0.913
# Hypothesis: η αρχιτεκτονική Lawin σχεδιάστηκε για 256×256 input όπου R=8 κάλυπτε
# 100% του feature map. Στο 608×608 (no-tile) μας, R=8 → 64×64 = 42% coverage.
# Αντικατάσταση R=8 → R=12 αυξάνει global context coverage σε 63% χωρίς memory hit.
# Διατηρούμε R=2, R=4 για fine/medium detail.


experiment:
  name: weedmapping-weedsgalore
  group: Best-SCSA-LawinR12
  continue_with_errors: false
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[asvf, scsa_f4, lawin_r12, focal_tversky_lovasz, cir_b_re, splitlawin_b0]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedsGaloreDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal_tversky_lovasz]
      params:
        alpha: [0.4]
        beta: [0.6]
        gamma: [1.3333]
        ft_weight: [0.5]
        lov_weight: [0.5]
        lovasz_classes: ['present']
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]
    mixed_precision: [True]

  early_stopping:
    patience: [30]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
    iou: *metric_params
  test_metrics:
    iou: *metric_params
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  model:
    name: [wd/models/splitlawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      main_channels: [3]
      main_pretrained: [['G', 'G', 'R']]
      side_pretrained: [['B', 'G']]
      fusion_type: ['squeeze_excite']
      # ASVF input module
      use_asvf: [True]
      asvf_nir_idx: [0]
      asvf_red_idx: [2]
      # SCSA F4 only (winner)
      use_scsa: [True]
      # Lawin pyramid ratios: R=8 → R=12 (scale extension for 608 input)
      lawin_ratios: [[12, 4, 2]]

  dataset:
    root: ["/workspace/datasets/weedsgalore/weedsgalore-dataset"]
    tile: [False]
    hor_flip: [True]
    ver_flip: [True]
    channels: [['CIR', 'B', 'RE']]
    batch_size: [4]
    val_batch_size: [2]
    test_batch_size: [2]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]

other_grids: []

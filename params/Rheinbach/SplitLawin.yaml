experiment:
  name: weedmapping-rededge
  group: SplitLawin
  continue_with_errors: true
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  entity: null
  excluded_files: '*.pth'
parameters:
  tags:
  - []
  phases:
  - - train
    - test
  dataset_interface:
  - wd/data/WeedMapDatasetInterface
  train_params:
    max_epochs:
    - 100
    initial_lr:
    - 0.0001
    optimizer:
    - Adam
    optimizer_params:
      weight_decay:
      - 0
    loss:
      name:
      - focal
      params:
        weight:
        - - 0.0638
          - 1.0
          - 1.6817
        gamma:
        - 2.0
    seed:
    - 42
    zero_weight_decay_on_bias_and_bn:
    - true
    average_best_models:
    - false
    greater_metric_to_watch_is_better:
    - false
    metric_to_watch:
    - loss
    freeze_pretrained:
    - true
    max_checkpoints:
    - 3
    ckpt_epoch_interval:
    - 25
  early_stopping:
    patience:
    - 10
    monitor:
    - loss
    mode:
    - min
  train_metrics:
    f1: &id001
      num_classes:
      - 3
  test_metrics:
    jaccard: *id001
    conf_mat: *id001
    auc: *id001
    f1: *id001
    precision: *id001
    recall: *id001
    perclassauc:
      discriminator:
      - - - auc_background
          - 0
        - - auc_crop
          - 1
        - - auc_weed
          - 2
  model:
    name:
    - wd/models/splitlawin
    params:
      backbone:
      - MiT-B0
      backbone_pretrained:
      - true
      main_channels:
      - 3
      side_pretrained:
      - G
      fusion_type:
      - conv_sum
  dataset:
    root:
    - dataset/0_rotations_processed_003_test/RedEdge
    train_folders:
    - - '000'
      - '001'
      - '002'
      - '004'
    test_folders:
    - - '003'
    hor_flip:
    - true
    ver_flip:
    - true
    channels:
    - - R
      - G
      - B
      - NIR
    batch_size:
    - 4
    val_batch_size:
    - 8
    test_batch_size:
    - 8
    num_workers:
    - 2
    num_classes:
    - 3
    return_path:
    - true
    size:
    - same
    crop_size:
    - same
    pin_memory:
    - true
  test_callbacks:
    PerExampleMetricCallback:
      phase:
      - TEST_BATCH_END
    SegmentationVisualizationCallback: null
  val_callbacks:
    SegmentationVisualizationCallback:
      batch_idxs:
      - - 4
        - 16
other_grids: null

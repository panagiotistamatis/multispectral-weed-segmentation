
# Paper baseline reproduction για Eschikon (Sequoia).
# Πιστή αναπαραγωγή της αρχικής config του LWViTs paper (Castellano et al. 2023):
#   Model:    Lawin-B0 (όχι SplitLawin) — single backbone
#   Channels: CIR alone (NIR, G, R) — 3 channels
#   Loss:     Focal + class weights [0.064, 1.0, 1.682] — paper exact
#   γ=2, Adam, lr=1e-4, batch=6, patience=10
#
# Reference:
#   - Paper Lawin-B0: F1=0.663
#   - User's previous reproduction: F1=0.589
#   - Our current (FT+Lov, no NDVI): F1=0.505
#
# Σκοπός: sanity check ότι το infrastructure δουλεύει και αν με paper config
# πάμε σε ~0.58, τότε το FT+Lovász δεν transfer-άρει σε Eschikon.


experiment:
  name: weedmapping-sequoia
  group: PaperBaseline-Eschikon
  continue_with_errors: true
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[paper_baseline, eschikon, sequoia, lawin_b0, focal_weighted]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedMapDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal]
      params:
        # Paper exact class weights — strong penalty στο background, boost weed
        weight: [[0.064, 1.0, 1.682]]
        gamma: [2.0]
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]
    mixed_precision: [True]

  early_stopping:
    patience: [10]                         # paper-style, σύντομο
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
    iou: *metric_params
  test_metrics:
    iou: *metric_params
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  # --- Paper architecture: Lawin (όχι Split), 3-channel CIR input ---
  model:
    name: [wd/models/lawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      input_channels: [3]
      main_pretrained: [['G', 'G', 'R']]   # CIR composite pretrained mapping

  dataset:
    root: ["/workspace/dataset/4_rotations_processed_005_test/Sequoia"]
    train_folders: [['006', '007']]
    test_folders: [['005']]
    hor_flip: [True]
    ver_flip: [True]
    # Plain CIR composite — 3 channels, paper baseline
    channels: [['NIR', 'G', 'R']]
    batch_size: [6]                        # paper-style
    val_batch_size: [12]
    test_batch_size: [12]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]
    pin_memory: [True]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]

other_grids: []

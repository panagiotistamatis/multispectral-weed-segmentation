
# Alternative Eschikon: CIR + RE (4 channels, χωρίς NDVI).
# Hypothesis: το NDVI στο side branch έβλαψε (αντίστοιχα με OSAVI/MSAVI στο WeedsGalore).
# Διαγνωστικό re-run για να δούμε αν drop NDVI βελτιώνει το F1=0.388.


experiment:
  name: weedmapping-sequoia
  group: WinnerXdataset-Eschikon-NoNDVI
  continue_with_errors: true
  start_from_grid: 0
  start_from_run: 0
  tracking_dir: null
  logger: wandb
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[cross_dataset, eschikon, sequoia, no_ndvi, focal_tversky_lovasz, splitlawin_b0]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedMapDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal_tversky_lovasz]
      params:
        alpha: [0.4]
        beta: [0.6]
        gamma: [1.3333]
        ft_weight: [0.5]
        lov_weight: [0.5]
        lovasz_classes: ['present']
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]
    mixed_precision: [True]

  early_stopping:
    patience: [30]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
    iou: *metric_params
  test_metrics:
    iou: *metric_params
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  model:
    name: [wd/models/splitlawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      main_channels: [3]
      main_pretrained: [['G', 'G', 'R']]   # CIR composite
      side_pretrained: [['G']]              # RE → G
      fusion_type: ['squeeze_excite']

  dataset:
    root: ["/workspace/dataset/4_rotations_processed_005_test/Sequoia"]
    train_folders: [['006', '007']]
    test_folders: [['005']]
    hor_flip: [True]
    ver_flip: [True]
    # CIR (NIR,G,R) + RE = 4 channels, χωρίς NDVI
    channels: [['NIR', 'G', 'R', 'RE']]
    batch_size: [4]
    val_batch_size: [8]
    test_batch_size: [8]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]
    pin_memory: [True]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]

other_grids: []

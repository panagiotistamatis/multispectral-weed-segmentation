
# Best runs from Table 2 of the paper — Eschikon (Sequoia)
# 4 runs — same models as Rheinbach (skip DoubleLawin B0 and SplitLawin B0)
#
# Grid 0: Lawin  MiT-B0 | R,G,NIR,RE | R,G weights  | Fine-tuning  → 1 run
# Grid 1: Lawin  MiT-B1 | NDVI        | R weights    | Freeze       → 1 run
# Grid 2: DoubleLawin MiT-B1 | R,G,NDVI | Drop       | Freeze       → 1 run
# Grid 3: SplitLawin  MiT-B1 | R,G,NDVI | Drop       | Fine-tuning  → 1 run

experiment:
  name: weedmapping-sequoia
  group: BestRuns-Eschikon
  continue_with_errors: true
  start_from_grid: 2
  start_from_run: 0
  tracking_dir: null
  entity: null
  excluded_files: "*.pth"

parameters:
  tags: [[best_run, eschikon, table2]]
  phases: [[train, test]]
  dataset_interface: [wd/data/WeedMapDatasetInterface]

  train_params:
    max_epochs: [500]
    initial_lr: [0.0001]
    optimizer: [Adam]
    optimizer_params:
      weight_decay: [0]
    loss:
      name: [focal]
      params:
        weight: [[0.0638, 1.0, 1.6817]]
        gamma: [2.0]
    seed: [42]
    zero_weight_decay_on_bias_and_bn: [True]
    average_best_models: [False]
    greater_metric_to_watch_is_better: [False]
    metric_to_watch: [loss]
    freeze_pretrained: [False]

  early_stopping:
    patience: [10]
    monitor: [loss]
    mode: [min]

  train_metrics:
    f1: &metric_params
      num_classes: &num_classes [3]
  test_metrics:
    jaccard: *metric_params
    conf_mat: *metric_params
    auc: *metric_params
    f1: *metric_params
    precision: *metric_params
    recall: *metric_params
    perclassauc:
      discriminator:
        [[
          ['auc_background', 0],
          ['auc_crop', 1],
          ['auc_weed', 2]
        ]]

  # --- Grid 0: Lawin MiT-B0 | R,G,NIR,RE | R,G weights | Fine-tuning ---
  model:
    name: [wd/models/lawin]
    params:
      backbone: [MiT-B0]
      backbone_pretrained: [True]
      main_channels: [2]
      main_pretrained: [['R', 'G']]
      side_pretrained: [null]

  dataset:
    root: ["dataset/4_rotations_processed_005_test/Sequoia"]
    train_folders: [['006', '007']]
    test_folders: [['005']]
    hor_flip: [True]
    ver_flip: [True]
    channels: [['R', 'G', 'NIR', 'RE']]
    batch_size: [6]
    val_batch_size: [12]
    test_batch_size: [12]
    num_workers: [0]
    num_classes: [3]
    return_path: [True]
    size: [same]
    crop_size: [same]

  test_callbacks:
    PerExampleMetricCallback:
      phase: [TEST_BATCH_END]
    SegmentationVisualizationCallback:
  val_callbacks:
    SegmentationVisualizationCallback:
      batch_idxs: [[4, 16]]

other_grids:
  # --- Grid 1: Lawin MiT-B1 | NDVI | R weights | Freeze ---
  - model:
      name: [wd/models/lawin]
      params:
        backbone: [MiT-B1]
        backbone_pretrained: [True]
        main_channels: [1]
        main_pretrained: [['R']]
        side_pretrained: [null]
    train_params:
      freeze_pretrained: [True]
    dataset:
      channels: [['NDVI']]

  # --- Grid 2: DoubleLawin MiT-B1 | R,G,NDVI | Drop | Freeze ---
  - model:
      name: [wd/models/doublelawin]
      params:
        backbone: [MiT-B1]
        backbone_pretrained: [True]
        main_channels: [2]
        side_pretrained: ['G']
        fusion_type: ['conv_sum_drop']
    train_params:
      freeze_pretrained: [True]
    dataset:
      channels: [['R', 'G', 'NDVI']]

  # --- Grid 3: SplitLawin MiT-B1 | R,G,NDVI | Drop | Fine-tuning ---
  - model:
      name: [wd/models/splitlawin]
      params:
        backbone: [MiT-B1]
        backbone_pretrained: [True]
        main_channels: [2]
        side_pretrained: ['G']
        fusion_type: ['conv_sum_drop']
    dataset:
      channels: [['R', 'G', 'NDVI']]
